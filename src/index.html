<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Levegőminőség Nagymaroson — helyi PM2.5 mérések megjelenítése SPS30 szenzorból."
    />
    <meta name="theme-color" content="#0b1216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Levegő" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="dark" />
    <title>Levegőminőség Nagymaroson</title>
    <script>
      (function () {
        try {
          var key = "levego-theme";
          var stored = localStorage.getItem(key);
          var theme =
            stored === "light" || stored === "dark" ? stored : "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", theme);
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute(
              "content",
              theme === "light" ? "#e9f0f2" : "#0b1216",
            );
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.colorScheme = "dark";
        }

        // Absolute /public paths — Bun HTML bundler would try to resolve them if
        // written as static <link href="/..."> attributes.
        var manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = "/manifest.webmanifest";
        document.head.appendChild(manifest);

        var apple = document.createElement("link");
        apple.rel = "apple-touch-icon";
        apple.href = "/icons/apple-touch-icon.png";
        document.head.appendChild(apple);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
